spring.application.name=ztp

# --- Server Port (Render dynamic $PORT with fallback to 8080 for local dev) ---
server.port=${PORT:8080}

# --- Database connection (Environment variables with local dev fallbacks) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ztp_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool (Resilient for cloud DB latency) ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Error handling: never leak stack traces to clients ---
server.error.include-stacktrace=never
server.error.include-message=never

# --- Mail (MailHog for local dev, overridden via env in prod) ---
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5176}
app.upload-dir=${APP_UPLOAD_DIR:./uploads/avatars}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.reports-dir=${APP_REPORTS_DIR:./uploads/reports}
app.ml-service-url=${APP_ML_SERVICE_URL:http://127.0.0.1:8081}

# --- Session persistence (Spring Session JDBC) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

# --- Cross-Origin Session & CSRF Cookie Settings (Required for cross-site SPA -> API) ---
app.cookie.same-site=${APP_COOKIE_SAMESITE:None}
app.cookie.secure=${APP_COOKIE_SECURE:true}
