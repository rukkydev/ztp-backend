spring.application.name=ztp

# --- Database connection (local dev only) ---
# TODO before production: replace root/blank password with a dedicated
# ztp_user that has only the privileges it needs (no root access).
spring.datasource.url=jdbc:mysql://localhost:3306/ztp_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# 'update' lets Hibernate auto-create/update tables from our @Entity classes
# while we're learning. We will switch to proper migrations (Flyway) later
# once the schema stabilizes -- auto-update is not safe for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# --- Error handling: never leak stack traces to clients ---
server.error.include-stacktrace=never
server.error.include-message=never
# --- Mail (MailHog for local dev) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.frontend-url=http://localhost:5176
app.upload-dir=./uploads/avatars
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.reports-dir=./uploads/reports
app.ml-service-url=http://127.0.0.1:8081

# --- Session persistence (Spring Session JDBC) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
